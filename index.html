<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Keyboard Piano</title>
<style>
  body { font-family: Arial, sans-serif; background: #f2f2f2; text-align: center; padding-top: 30px; }
  h1 { margin-bottom: 5px; }
 .piano { display: flex; gap: 6px; justify-content: center; margin-top: 30px; }
 .key {
    width: 60px; height: 200px; background: white;
    border: 1px solid #999; border-radius: 6px;
    text-align: center; padding-top: 15px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    font-weight: bold; user-select: none;
  }
 .key.active { background: gold; transform: translateY(3px); }
  kbd { display:inline-block; margin-top:10px; background:#eee; padding:3px 6px; border:1px solid #ccc; border-radius:3px; }
  #lastNote { font-size: 24px; margin-top: 15px; height: 30px; }
</style>
</head>
<body>

<h1>My Keyboard Piano</h1>
<p>Press A S D F G H J K to play</p>
<div id="lastNote"></div>

<div class="piano">
  <div class="key" data-key="a">C<br>Do<br><kbd>A</kbd></div>
  <div class="key" data-key="s">D<br>Re<br><kbd>S</kbd></div>
  <div class="key" data-key="d">E<br>Mi<br><kbd>D</kbd></div>
  <div class="key" data-key="f">F<br>Fa<br><kbd>F</kbd></div>
  <div class="key" data-key="g">G<br>Sol<br><kbd>G</kbd></div>
  <div class="key" data-key="h">A<br>La<br><kbd>H</kbd></div>
  <div class="key" data-key="j">B<br>Ti<br><kbd>J</kbd></div>
  <div class="key" data-key="k">C<br>Do<br><kbd>K</kbd></div>
</div>

<script>
// Sound helper from assignment
const ctx = new (window.AudioContext || window.webkitAudioContext)();
function playNote(freq) {
  const osc = ctx.createOscillator();
  osc.frequency.value = freq;
  osc.type = 'sine';
  osc.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.4);
}

// Key map from PDF page 2
const frequencies = { a:262, s:294, d:330, f:349, g:392, h:440, j:494, k:523 };
const names = { a:'C Do', s:'D Re', d:'E Mi', f:'F Fa', g:'G Sol', h:'A La', j:'B Ti', k:'C Do (high)' };

// keydown listener - requirement
document.addEventListener("keydown", function(e) {
  if (e.repeat) return; // fix repeat when holding
  const key = e.key.toLowerCase(); // fix Caps Lock
  console.log(e.key); // Step 4 from PDF - for testing

  if (!frequencies[key]) return; // ignore other keys - no error

  const pianoKey = document.querySelector(`[data-key="${key}"]`);
  if (pianoKey) {
    pianoKey.classList.add('active');
    playNote(frequencies[key]);
    document.getElementById('lastNote').textContent = "Playing: " + names[key];
  }
});

// keyup listener - requirement
document.addEventListener("keyup", function(e) {
  const key = e.key.toLowerCase();
  if (!frequencies[key]) return;
  const pianoKey = document.querySelector(`[data-key="${key}"]`);
  if (pianoKey) {
    pianoKey.classList.remove('active');
  }
});
</script>

</body>
</html>
